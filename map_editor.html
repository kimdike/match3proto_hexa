<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>맵 에디터 - 헥사 3매치 퍼즐</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      user-select: none;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── 상단 스테이지 탭 ── */
    .stage-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px;
      background: #16162a;
      border-bottom: 2px solid #3a3a6e;
    }
    .stage-tab-list {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      flex: 1;
      padding-bottom: 4px;
    }
    .stage-tab-list::-webkit-scrollbar { height: 4px; }
    .stage-tab-list::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }
    .stage-tab {
      min-width: 48px; height: 36px;
      border: 2px solid #444;
      border-radius: 8px;
      background: #2a2a3e;
      color: #aaa;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .stage-tab:hover { border-color: #7c6fff; color: #fff; }
    .stage-tab.active {
      border-color: #7c6fff;
      background: #7c6fff;
      color: #fff;
    }
    .add-stage-btn {
      min-width: 36px; height: 36px;
      border: 2px dashed #555;
      border-radius: 8px;
      background: transparent;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .add-stage-btn:hover { border-color: #2ecc71; color: #2ecc71; }

    /* ── 메인 레이아웃 ── */
    .editor-body {
      display: flex;
      flex: 1;
      gap: 16px;
      padding: 16px;
      justify-content: center;
      align-items: flex-start;
    }

    /* ── 좌측 도구 패널 ── */
    .tool-panel {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px;
      background: #1e1e3a;
      border: 2px solid #3a3a6e;
      border-radius: 10px;
      min-width: 100px;
    }
    .tool-panel-title {
      color: #888;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
      padding-bottom: 4px;
      border-bottom: 1px solid #444;
    }
    .tool-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 2px solid #444;
      border-radius: 8px;
      background: #2a2a3e;
      color: #e0e0e0;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tool-btn:hover { border-color: #7c6fff; }
    .tool-btn.active { border-color: #2ecc71; background: rgba(46,204,113,0.15); color: #2ecc71; }
    .tool-btn img { width: 24px; height: 24px; object-fit: contain; }
    .tool-btn.entrance-tool { color: #2ecc71; }
    .tool-btn.entrance-tool.active { border-color: #2ecc71; background: rgba(46,204,113,0.15); color: #2ecc71; }
    .tool-btn.dead-tool { color: #e74c3c; }
    .tool-btn.dead-tool.active { border-color: #e74c3c; background: rgba(231,76,60,0.15); color: #e74c3c; }
    .tool-btn.pass-tool { color: #3498db; }
    .tool-btn.pass-tool.active { border-color: #3498db; background: rgba(52,152,219,0.15); color: #3498db; }
    .tool-btn.eraser { color: #e74c3c; }
    .tool-btn.eraser.active { border-color: #e74c3c; background: rgba(231,76,60,0.15); color: #e74c3c; }

    /* ── 스테이지 설정 ── */
    .setting-group { margin-bottom: 8px; }
    .setting-group label {
      display: block;
      color: #aaa;
      font-size: 12px;
      margin-bottom: 4px;
    }
    .ct-btns { display: flex; gap: 4px; }
    .ct-btn {
      flex: 1;
      padding: 6px;
      border: 2px solid #444;
      border-radius: 6px;
      background: #2a2a3e;
      color: #aaa;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s;
    }
    .ct-btn:hover { border-color: #7c6fff; color: #fff; }
    .ct-btn.active { border-color: #f1c40f; background: rgba(241,196,15,0.15); color: #f1c40f; }
    .moves-input {
      width: 100%;
      padding: 6px 8px;
      border: 2px solid #444;
      border-radius: 6px;
      background: #2a2a3e;
      color: #e0e0e0;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      outline: none;
    }
    .moves-input:focus { border-color: #7c6fff; }

    /* ── 헥사 그리드 ── */
    .grid-area { position: relative; }
    .grid-container { position: relative; }
    .hex-cell {
      position: absolute;
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      background: #333350;
      cursor: pointer;
      transition: filter 0.1s;
    }
    .hex-cell::after {
      content: '';
      position: absolute;
      inset: 2px;
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      background: #252540;
    }
    .hex-cell:hover { filter: brightness(1.3); }
    .hex-cell.has-gimmick { filter: brightness(1.1); }
    .hex-cell.entrance { background: #2ecc71; }
    .hex-cell.entrance::after { background: rgba(46,204,113,0.25); }
    .hex-cell.dead { background: #e74c3c; }
    .hex-cell.dead::after { background: rgba(231,76,60,0.25); }
    .hex-cell.off { background: #222; opacity: 0.4; }
    .hex-cell.off::after { background: #1a1a1a; }
    .hex-cell.pass { background: #3498db; }
    .hex-cell.pass::after { background: rgba(52,152,219,0.25); }

    .gimmick-img {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      object-fit: contain;
    }

    /* 잔디 (타일형) — 셀 바닥. CSS 헥사 도형 (인게임 .gimmick-tile과 동일 톤) */
    .grass-tile {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    }
    .grass-tile.grass-2 {
      background:
        repeating-linear-gradient(45deg, rgba(0,0,0,0.18) 0 2px, transparent 2px 6px),
        #2c5a2c;
    }
    .grass-tile.grass-1 {
      background:
        repeating-linear-gradient(45deg, rgba(0,0,0,0.10) 0 2px, transparent 2px 8px),
        #79c95c;
    }
    .tool-btn .grass-icon {
      display: inline-block;
      width: 24px; height: 24px;
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    }
    .tool-btn .grass-icon.grass-1 {
      background:
        repeating-linear-gradient(45deg, rgba(0,0,0,0.10) 0 2px, transparent 2px 8px),
        #79c95c;
    }
    .tool-btn .grass-icon.grass-2 {
      background:
        repeating-linear-gradient(45deg, rgba(0,0,0,0.18) 0 2px, transparent 2px 6px),
        #2c5a2c;
    }

    /* ── 미션 에디터 ── */
    .missions-editor {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 4px;
    }
    .mission-row {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 4px;
      background: #2a2a3e;
      border: 1px solid #3a3a6e;
      border-radius: 6px;
    }
    .mission-row select {
      flex: 1;
      padding: 4px 6px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #1e1e3a;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }
    .mission-row .mission-count-display {
      width: 44px;
      height: 24px;
      padding: 0 4px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #1e1e3a;
      color: #f1c40f;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: help;
    }
    .mission-del {
      background: transparent;
      border: 1px solid #e74c3c;
      border-radius: 4px;
      color: #e74c3c;
      width: 22px;
      height: 22px;
      cursor: pointer;
      font-size: 11px;
      line-height: 1;
    }
    .mission-del:hover { background: #e74c3c; color: #fff; }
    .add-mission-btn {
      padding: 6px;
      font-size: 12px;
      border: 1px dashed #555;
      border-radius: 6px;
      background: transparent;
      color: #888;
      cursor: pointer;
      width: 100%;
    }
    .add-mission-btn:hover:not(:disabled) { border-color: #2ecc71; color: #2ecc71; }
    .add-mission-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .mission-priority-hint {
      color: #777;
      font-size: 10px;
      line-height: 1.3;
      padding: 0 2px 4px;
    }

    .coord-label {
      position: absolute;
      z-index: 2;
      color: rgba(255,255,255,0.25);
      font-size: 9px;
      pointer-events: none;
      text-align: center;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .coord-label.type-entrance {
      color: rgba(255,255,255,0.9);
      font-size: 16px;
      font-weight: bold;
    }
    .coord-label.type-dead {
      color: rgba(255,255,255,0.9);
      font-size: 16px;
      font-weight: bold;
    }
    .coord-label.type-pass {
      color: rgba(255,255,255,0.9);
      font-size: 16px;
      font-weight: bold;
    }
    .coord-label.type-off {
      color: rgba(255,255,255,0.15);
      font-size: 14px;
    }

    /* ── 하단 버튼 ── */
    .bottom-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      background: #16162a;
      border-top: 2px solid #3a3a6e;
      flex-wrap: wrap;
    }
    .action-btn {
      padding: 10px 24px;
      border: 2px solid #444;
      border-radius: 8px;
      background: #2a2a3e;
      color: #e0e0e0;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s;
    }
    .action-btn:hover { border-color: #7c6fff; color: #fff; }
    .action-btn.danger { border-color: #e74c3c; color: #e74c3c; }
    .action-btn.danger:hover { background: #e74c3c; color: #fff; }
    .action-btn.primary { border-color: #2ecc71; color: #2ecc71; }
    .action-btn.primary:hover { background: #2ecc71; color: #fff; }
    .action-btn.save { border-color: #3498db; color: #3498db; }
    .action-btn.save:hover { background: #3498db; color: #fff; }

    /* ── 스테이지 요약 ── */
    .stage-summary {
      text-align: center;
      padding: 8px;
      color: #888;
      font-size: 13px;
    }
    .stage-summary strong { color: #f1c40f; }
    .dirty-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      background: #e67e22;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      margin-left: 8px;
    }
  </style>
</head>
<body>

  <!-- 스테이지 탭 -->
  <div class="stage-tabs">
    <div class="stage-tab-list" id="stage-tab-list"></div>
    <button class="add-stage-btn" id="btn-add-stage" title="스테이지 추가">+</button>
  </div>

  <!-- 메인 -->
  <div class="editor-body">
    <!-- 도구 패널 -->
    <div class="tool-panel">
      <div class="tool-panel-title">스테이지 설정</div>
      <div class="setting-group">
        <label>블록 종류 수</label>
        <div class="ct-btns">
          <button class="ct-btn" data-ct="5">5</button>
          <button class="ct-btn" data-ct="6">6</button>
          <button class="ct-btn" data-ct="7">7</button>
        </div>
      </div>
      <div class="setting-group">
        <label>Move 수</label>
        <input type="number" class="moves-input" id="moves-input" min="1" max="99" value="30">
      </div>
      <div class="tool-panel-title">미션 (최대 4)</div>
      <div class="mission-priority-hint">위에서부터 타겟볼 우선순위</div>
      <div class="missions-editor" id="missions-editor"></div>
      <button class="add-mission-btn" id="btn-add-mission">+ 미션 추가</button>
      <div class="tool-panel-title">셀 타입</div>
      <button class="tool-btn entrance-tool" data-tool="entrance">E 사출구</button>
      <button class="tool-btn dead-tool" data-tool="dead">D 데드셀</button>
      <button class="tool-btn pass-tool" data-tool="pass">P 패스셀</button>
      <div class="tool-panel-title">기믹 배치</div>
      <button class="tool-btn" data-tool="stone" data-level="1">
        <img src="assets/gimmick/stone_1.png"> 돌 1
      </button>
      <button class="tool-btn" data-tool="stone" data-level="2">
        <img src="assets/gimmick/stone_2.png"> 돌 2
      </button>
      <button class="tool-btn" data-tool="stone" data-level="3">
        <img src="assets/gimmick/stone_3.png"> 돌 3
      </button>
      <button class="tool-btn" data-tool="stone" data-level="4">
        <img src="assets/gimmick/stone_4.png"> 돌 4
      </button>
      <button class="tool-btn" data-tool="stone" data-level="5">
        <img src="assets/gimmick/stone_5.png"> 돌 5
      </button>
      <button class="tool-btn" data-tool="grass" data-level="1">
        <span class="grass-icon grass-1"></span> 잔디 1
      </button>
      <button class="tool-btn" data-tool="grass" data-level="2">
        <span class="grass-icon grass-2"></span> 잔디 2
      </button>
      <button class="tool-btn eraser" data-tool="eraser">✕ 지우기</button>
    </div>

    <!-- 그리드 -->
    <div class="grid-area">
      <div class="stage-summary" id="stage-summary"></div>
      <div class="grid-container" id="grid-container"></div>
    </div>
  </div>

  <!-- 하단 버튼 -->
  <div class="bottom-bar">
    <button class="action-btn save" id="btn-save">이 스테이지 저장</button>
    <button class="action-btn danger" id="btn-reset-stage">이 스테이지 초기화</button>
    <button class="action-btn" id="btn-import">JSON 가져오기</button>
    <button class="action-btn primary" id="btn-export">JSON 내보내기</button>
    <input type="file" id="file-import" accept=".json" style="display:none">
  </div>

<script>
// ── 상수 ──
const COLS_PATTERN = [9, 8, 9, 8, 9, 8, 9, 8, 9];
const HEX_SIZE = 36;
const HEX_W = HEX_SIZE * 2;
const HEX_H = Math.sqrt(3) * HEX_SIZE;
const COL_SPACING = HEX_SIZE * 1.5;
const ROW_SPACING = HEX_H;
const MAX_STAGES = 1000;
const LS_KEY = 'hexMapEditorData_v2';

// ── 상태 ──
let savedStages = {};  // { stageNum: { settings, cells, gimmicks } }
let stageList = [];     // [1, 2, 3, ...]
let currentStage = 1;
let currentTool = null; // { tool, level? }
let working = null;     // { settings, cells, gimmicks }
let isDirty = false;

// ── 유틸 ──
function isLongCol(c) { return COLS_PATTERN[c] === 9; }
function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }

function getCellPos(col, row) {
  // row=-1(사출구)도 표시하기 위해 +1 오프셋
  const dr = row + 1;
  return {
    x: col * COL_SPACING,
    y: dr * ROW_SPACING + (isLongCol(col) ? 0 : ROW_SPACING * 0.5)
  };
}

function getCellType(col, row) {
  const key = `${col},${row}`;
  return working.cells[key] || (row === -1 ? 'off' : 'normal');
}

// ── 기본 스테이지 생성 ──
function createDefaultStage() {
  const cells = {};
  for (let c = 0; c < COLS_PATTERN.length; c++) cells[`${c},-1`] = 'entrance';
  return { settings: { colorTypes: 5, moves: 30 }, cells, gimmicks: {}, missions: [] };
}

// 미션 type 옵션 (향후 ice/crates/keys 추가 자리)
const MISSION_TYPES = [
  { val: 'stones', label: '돌' },
  { val: 'grass',  label: '잔디' },
  // { val: 'ice',    label: '얼음' },
  // { val: 'crates', label: '상자' },
  // { val: 'keys',   label: '열쇠' },
];
const MAX_MISSIONS = 4;

// ── localStorage ──
function loadFromStorage() {
  const raw = localStorage.getItem(LS_KEY);
  if (raw) {
    try {
      const data = JSON.parse(raw);
      savedStages = data.stages || {};
      stageList = data.stageList || [];
      if (stageList.length > 0) return;
    } catch(e) {}
  }
  migrateOldData();
}

function migrateOldData() {
  savedStages = {};
  stageList = [];
  let oldGimmicks = {}, oldSettings = {};
  try { oldGimmicks = JSON.parse(localStorage.getItem('hexMapEditorData')) || {}; } catch(e) {}
  try { oldSettings = JSON.parse(localStorage.getItem('hexMapEditorData_settings')) || {}; } catch(e) {}

  for (let i = 1; i <= 10; i++) {
    const stage = createDefaultStage();
    if (oldSettings[i]) stage.settings = { ...stage.settings, ...oldSettings[i] };
    if (oldGimmicks[i]) stage.gimmicks = deepCopy(oldGimmicks[i]);
    savedStages[i] = stage;
    stageList.push(i);
  }
  if (stageList.length === 0) {
    savedStages[1] = createDefaultStage();
    stageList = [1];
  }
  saveToStorage();
}

function saveToStorage() {
  localStorage.setItem(LS_KEY, JSON.stringify({ stageList, stages: savedStages }));
}

function loadStageToWorking(num) {
  working = deepCopy(savedStages[num] || createDefaultStage());
  if (!Array.isArray(working.missions)) working.missions = [];
  isDirty = false;
}

function saveCurrentStage() {
  savedStages[currentStage] = deepCopy(working);
  saveToStorage();
  isDirty = false;
  updateSummary();
}

function markDirty() {
  isDirty = true;
  updateSummary();
}

// ── 스테이지 관리 ──
function switchStage(num) {
  if (num === currentStage) return;
  if (isDirty && !confirm(`Stage ${currentStage}의 변경사항이 저장되지 않았습니다.\n이동하시겠습니까?`)) return;
  currentStage = num;
  loadStageToWorking(num);
  renderGrid();
  updateTabs();
}

function addStage() {
  if (isDirty && !confirm(`Stage ${currentStage}의 변경사항이 저장되지 않았습니다.\n새 스테이지로 이동하시겠습니까?`)) return;
  const nextNum = stageList.length > 0 ? Math.max(...stageList) + 1 : 1;
  if (nextNum > MAX_STAGES) { alert(`최대 ${MAX_STAGES}개까지 추가 가능합니다.`); return; }
  savedStages[nextNum] = createDefaultStage();
  stageList.push(nextNum);
  saveToStorage();
  currentStage = nextNum;
  loadStageToWorking(nextNum);
  buildTabs();
  renderGrid();
}

// ── 탭 ──
function buildTabs() {
  const container = document.getElementById('stage-tab-list');
  container.innerHTML = '';
  for (const num of stageList) {
    const btn = document.createElement('button');
    btn.className = 'stage-tab' + (num === currentStage ? ' active' : '');
    btn.textContent = num;
    btn.dataset.stage = num;
    btn.addEventListener('click', () => switchStage(num));
    container.appendChild(btn);
  }
  setTimeout(() => {
    const active = container.querySelector('.stage-tab.active');
    if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
  }, 0);
}

function updateTabs() {
  document.querySelectorAll('.stage-tab').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.stage) === currentStage);
  });
}

// ── 그리드 렌더링 ──
function renderGrid() {
  const container = document.getElementById('grid-container');
  container.innerHTML = '';

  const totalW = (COLS_PATTERN.length - 1) * COL_SPACING + HEX_W;
  const totalH = 10 * ROW_SPACING + HEX_H * 0.5; // +1 row for entrance
  container.style.width = `${totalW}px`;
  container.style.height = `${totalH}px`;

  // 사출구 행 (row = -1)
  for (let col = 0; col < COLS_PATTERN.length; col++) renderCell(container, col, -1);
  // 일반 행
  for (let col = 0; col < COLS_PATTERN.length; col++)
    for (let row = 0; row < COLS_PATTERN[col]; row++) renderCell(container, col, row);

  updateSummary();
  updateSettingsUI();
  renderMissions();
}

function renderCell(container, col, row) {
  const pos = getCellPos(col, row);
  const key = `${col},${row}`;
  const type = getCellType(col, row);

  // 셀
  const cell = document.createElement('div');
  cell.className = 'hex-cell';
  if (type === 'entrance') cell.classList.add('entrance');
  else if (type === 'dead') cell.classList.add('dead');
  else if (type === 'pass') cell.classList.add('pass');
  else if (type === 'off') cell.classList.add('off');
  cell.style.left = `${pos.x}px`;
  cell.style.top = `${pos.y}px`;
  cell.style.width = `${HEX_W}px`;
  cell.style.height = `${HEX_H}px`;

  // 라벨
  const label = document.createElement('div');
  label.className = 'coord-label';
  label.style.left = `${pos.x}px`;
  label.style.top = `${pos.y}px`;
  label.style.width = `${HEX_W}px`;
  label.style.height = `${HEX_H}px`;

  if (type === 'entrance') {
    label.textContent = 'E';
    label.classList.add('type-entrance');
  } else if (type === 'dead') {
    label.textContent = 'D';
    label.classList.add('type-dead');
  } else if (type === 'pass') {
    label.textContent = 'P';
    label.classList.add('type-pass');
  } else if (type === 'off') {
    label.textContent = '\u2014';
    label.classList.add('type-off');
  } else {
    label.textContent = `${col},${row}`;
  }

  // 기믹 (normal 셀만): stone=이미지 / grass=CSS 타일 / 향후 crate/ice 분기 추가
  const gimmick = working.gimmicks[key];
  if (gimmick && type === 'normal') {
    cell.classList.add('has-gimmick');
    if (gimmick.type === 'grass') {
      const tile = document.createElement('div');
      tile.className = `grass-tile grass-${gimmick.level}`;
      tile.style.left = `${pos.x}px`;
      tile.style.top = `${pos.y}px`;
      tile.style.width = `${HEX_W}px`;
      tile.style.height = `${HEX_H}px`;
      container.appendChild(tile);
    } else {
      const img = document.createElement('img');
      img.className = 'gimmick-img';
      img.src = `assets/gimmick/${gimmick.type}_${gimmick.level}.png`;
      img.style.left = `${pos.x}px`;
      img.style.top = `${pos.y}px`;
      img.style.width = `${HEX_W}px`;
      img.style.height = `${HEX_H}px`;
      container.appendChild(img);
    }
  }

  cell.addEventListener('click', () => onCellClick(col, row));
  container.appendChild(cell);
  container.appendChild(label);
}

// ── 셀 클릭 ──
function onCellClick(col, row) {
  if (!currentTool) return;
  const tool = currentTool.tool;
  const key = `${col},${row}`;

  if (tool === 'entrance') {
    // 모든 셀에 사출구 배치/토글 가능
    const cur = getCellType(col, row);
    if (cur === 'entrance') {
      delete working.cells[key];
    } else {
      working.cells[key] = 'entrance';
      delete working.gimmicks[key]; // 기믹 제거
    }
    markDirty();
  } else if (tool === 'dead') {
    // row>=0 토글
    if (row >= 0) {
      if (getCellType(col, row) === 'dead') {
        delete working.cells[key];
      } else {
        working.cells[key] = 'dead';
        delete working.gimmicks[key];
      }
      markDirty();
    }
  } else if (tool === 'pass') {
    if (row >= 0) {
      if (getCellType(col, row) === 'pass') {
        delete working.cells[key];
      } else {
        working.cells[key] = 'pass';
        delete working.gimmicks[key];
      }
      markDirty();
    }
  } else if (tool === 'stone' || tool === 'grass') {
    if (row >= 0 && getCellType(col, row) === 'normal') {
      working.gimmicks[key] = { col, row, type: tool, level: currentTool.level };
      markDirty();
    }
  } else if (tool === 'eraser') {
    let changed = false;
    if (row >= 0) {
      if (working.gimmicks[key]) { delete working.gimmicks[key]; changed = true; }
      if (working.cells[key]) { delete working.cells[key]; changed = true; }
    } else {
      // row=-1: 사출구 복원
      if (!working.cells[key] || working.cells[key] !== 'entrance') {
        working.cells[key] = 'entrance';
        changed = true;
      }
    }
    if (changed) markDirty();
  }

  renderGrid();
}

// ── 요약 / 설정 UI ──
function updateSummary() {
  const gimmickCount = Object.keys(working.gimmicks).length;
  const deadCount = Object.values(working.cells).filter(t => t === 'dead').length;
  const entranceCount = Object.values(working.cells).filter(t => t === 'entrance').length;
  const passCount = Object.values(working.cells).filter(t => t === 'pass').length;
  const missionCount = Array.isArray(working.missions) ? working.missions.length : 0;
  const dirtyBadge = isDirty ? '<span class="dirty-badge">미저장</span>' : '';
  document.getElementById('stage-summary').innerHTML =
    `Stage <strong>${currentStage}</strong> \u2014 ` +
    `사출구 <strong>${entranceCount}</strong> \u00B7 ` +
    `데드셀 <strong>${deadCount}</strong> \u00B7 ` +
    `패스 <strong>${passCount}</strong> \u00B7 ` +
    `기믹 <strong>${gimmickCount}</strong> · ` +
    `미션 <strong>${missionCount}</strong>${dirtyBadge}`;
}

function updateSettingsUI() {
  document.querySelectorAll('.ct-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.ct) === working.settings.colorTypes);
  });
  document.getElementById('moves-input').value = working.settings.moves;
}

// ── 미션 에디터 ──
// 미션 count는 보드 배치 갯수와 자동 동기화 (readonly 표시)
// 사용자는 type 순서만 결정 (= 타겟볼 우선순위), count는 항상 보드 = 진실
function countTypeOnBoard(type) {
  let cnt = 0;
  for (const g of Object.values(working.gimmicks)) {
    if (g && g.type === type) cnt++;
  }
  return cnt;
}

function syncMissionsToBoard() {
  if (!Array.isArray(working.missions)) return;
  for (const m of working.missions) {
    m.count = countTypeOnBoard(m.type);
  }
}

function renderMissions() {
  const container = document.getElementById('missions-editor');
  if (!container) return;
  if (!Array.isArray(working.missions)) working.missions = [];
  // 자동 sync: count = 보드 배치 갯수 (모든 진입점에서 보장)
  syncMissionsToBoard();
  container.innerHTML = '';
  working.missions.forEach((m, idx) => {
    const row = document.createElement('div');
    row.className = 'mission-row';

    const select = document.createElement('select');
    for (const t of MISSION_TYPES) {
      const opt = document.createElement('option');
      opt.value = t.val;
      opt.textContent = t.label;
      if (t.val === m.type) opt.selected = true;
      select.appendChild(opt);
    }
    select.addEventListener('change', e => {
      working.missions[idx].type = e.target.value;
      markDirty();
      renderMissions(); // type 변경 시 count 자동 sync
    });

    const countDisplay = document.createElement('span');
    countDisplay.className = 'mission-count-display';
    countDisplay.textContent = m.count;
    countDisplay.title = '보드 배치 갯수와 자동 동기화';

    const delBtn = document.createElement('button');
    delBtn.className = 'mission-del';
    delBtn.textContent = '✕';
    delBtn.title = '미션 삭제';
    delBtn.addEventListener('click', () => {
      working.missions.splice(idx, 1);
      markDirty();
      renderMissions();
    });

    row.appendChild(select);
    row.appendChild(countDisplay);
    row.appendChild(delBtn);
    container.appendChild(row);
  });

  const addBtn = document.getElementById('btn-add-mission');
  if (addBtn) addBtn.disabled = working.missions.length >= MAX_MISSIONS;
}

function addMission() {
  if (!Array.isArray(working.missions)) working.missions = [];
  if (working.missions.length >= MAX_MISSIONS) return;
  // 디폴트로 아직 미션에 없는 첫 type 선택 (없으면 stones)
  const usedTypes = new Set(working.missions.map(m => m.type));
  const firstUnused = MISSION_TYPES.find(t => !usedTypes.has(t.val));
  const defaultType = firstUnused ? firstUnused.val : 'stones';
  working.missions.push({ type: defaultType, count: 0 }); // count는 renderMissions에서 자동 sync
  markDirty();
  renderMissions();
}

// ── 도구 버튼 ──
function setupTools() {
  document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tool = btn.dataset.tool;
      const level = btn.dataset.level ? parseInt(btn.dataset.level) : null;
      const key = level ? `${tool}_${level}` : tool;
      const currentKey = currentTool
        ? (currentTool.level ? `${currentTool.tool}_${currentTool.level}` : currentTool.tool)
        : null;

      if (currentKey === key) {
        currentTool = null;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      } else {
        currentTool = level ? { tool, level } : { tool };
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
    });
  });
}

// ── 설정 UI ──
function setupSettings() {
  document.querySelectorAll('.ct-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      working.settings.colorTypes = parseInt(btn.dataset.ct);
      markDirty();
      updateSettingsUI();
    });
  });
  document.getElementById('moves-input').addEventListener('change', (e) => {
    const val = parseInt(e.target.value);
    if (val >= 1 && val <= 99) {
      working.settings.moves = val;
      markDirty();
    }
  });
}

// ── 하단 버튼 ──
function setupActions() {
  // 저장
  document.getElementById('btn-save').addEventListener('click', () => {
    saveCurrentStage();
    alert(`Stage ${currentStage} 저장 완료!`);
  });

  // 초기화
  document.getElementById('btn-reset-stage').addEventListener('click', () => {
    if (!confirm(`Stage ${currentStage}를 초기화할까요?`)) return;
    working = deepCopy(createDefaultStage());
    markDirty();
    renderGrid();
  });

  // JSON 내보내기
  document.getElementById('btn-export').addEventListener('click', () => {
    if (isDirty && confirm('현재 스테이지에 미저장 변경사항이 있습니다.\n저장 후 내보내시겠습니까?')) {
      saveCurrentStage();
    }
    const stages = [];
    for (const num of stageList) {
      const data = savedStages[num];
      if (!data) continue;
      const cells = [];
      for (const [k, type] of Object.entries(data.cells)) {
        const [c, r] = k.split(',').map(Number);
        cells.push({ col: c, row: r, type });
      }
      const gimmicks = Object.values(data.gimmicks).map(g => ({
        col: g.col, row: g.row, type: g.type, level: g.level
      }));
      const stageObj = {
        stage: num,
        colorTypes: data.settings.colorTypes,
        moves: data.settings.moves,
      };
      // missions: 모델 D — 정의된 항목만 export (count > 0)
      if (Array.isArray(data.missions) && data.missions.length > 0) {
        const cleaned = data.missions
          .filter(m => m && m.type && (m.count|0) > 0)
          .map(m => ({ type: m.type, count: m.count|0 }));
        if (cleaned.length > 0) stageObj.missions = cleaned;
      }
      stageObj.cells = cells;
      stageObj.gimmicks = gimmicks;
      stages.push(stageObj);
    }
    const json = JSON.stringify({ stages }, null, 2);
    const jsContent = 'var STAGE_MAPS_DATA = ' + json + ';\n';
    const blob = new Blob([jsContent], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'stage_maps.js';
    a.click();
    URL.revokeObjectURL(url);
  });

  // JSON 가져오기
  document.getElementById('btn-import').addEventListener('click', () => {
    document.getElementById('file-import').click();
  });
  document.getElementById('file-import').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.stages || !Array.isArray(data.stages)) {
          alert('올바른 stage_maps.json 형식이 아닙니다.');
          return;
        }
        savedStages = {};
        stageList = [];
        for (const s of data.stages) {
          const num = s.stage;
          const stage = createDefaultStage();
          if (s.colorTypes) stage.settings.colorTypes = s.colorTypes;
          if (s.moves) stage.settings.moves = s.moves;
          // missions 로드 (모델 D)
          if (Array.isArray(s.missions)) {
            stage.missions = s.missions
              .filter(m => m && m.type && (m.count|0) > 0)
              .map(m => ({ type: m.type, count: m.count|0 }));
          }
          // cells 로드 (있으면 사용, 없으면 기본 사출구 9개 유지)
          if (s.cells && Array.isArray(s.cells)) {
            stage.cells = {};
            for (const cell of s.cells) {
              stage.cells[`${cell.col},${cell.row}`] = cell.type;
            }
          }
          // gimmicks 로드
          if (s.gimmicks) {
            for (const g of s.gimmicks) {
              stage.gimmicks[`${g.col},${g.row}`] = { col: g.col, row: g.row, type: g.type, level: g.level };
            }
          }
          savedStages[num] = stage;
          stageList.push(num);
        }
        stageList.sort((a, b) => a - b);
        saveToStorage();
        currentStage = stageList[0] || 1;
        loadStageToWorking(currentStage);
        buildTabs();
        renderGrid();
        alert('가져오기 완료!');
      } catch (err) {
        alert('JSON 파싱 실패: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // 스테이지 추가
  document.getElementById('btn-add-stage').addEventListener('click', addStage);

  // 미션 추가
  const addMissionBtn = document.getElementById('btn-add-mission');
  if (addMissionBtn) addMissionBtn.addEventListener('click', addMission);
}

// ── 초기화 ──
loadFromStorage();
if (stageList.length === 0) {
  savedStages[1] = createDefaultStage();
  stageList = [1];
  saveToStorage();
}
currentStage = stageList[0];
loadStageToWorking(currentStage);
buildTabs();
setupTools();
setupSettings();
setupActions();
renderGrid();
</script>
</body>
</html>
