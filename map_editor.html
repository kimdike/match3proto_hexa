<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>맵 에디터 - 헥사 3매치 퍼즐</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      user-select: none;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── 상단 스테이지 탭 ── */
    .stage-tabs {
      display: flex;
      justify-content: center;
      gap: 4px;
      padding: 16px 12px 12px;
      background: #16162a;
      border-bottom: 2px solid #3a3a6e;
    }
    .stage-tab {
      width: 56px; height: 36px;
      border: 2px solid #444;
      border-radius: 8px;
      background: #2a2a3e;
      color: #aaa;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s;
    }
    .stage-tab:hover { border-color: #7c6fff; color: #fff; }
    .stage-tab.active {
      border-color: #7c6fff;
      background: #7c6fff;
      color: #fff;
    }

    /* ── 메인 레이아웃 ── */
    .editor-body {
      display: flex;
      flex: 1;
      gap: 16px;
      padding: 16px;
      justify-content: center;
      align-items: flex-start;
    }

    /* ── 좌측 도구 패널 ── */
    .tool-panel {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px;
      background: #1e1e3a;
      border: 2px solid #3a3a6e;
      border-radius: 10px;
      min-width: 100px;
    }
    .tool-panel-title {
      color: #888;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
      padding-bottom: 4px;
      border-bottom: 1px solid #444;
    }
    .tool-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 2px solid #444;
      border-radius: 8px;
      background: #2a2a3e;
      color: #e0e0e0;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tool-btn:hover { border-color: #7c6fff; }
    .tool-btn.active { border-color: #2ecc71; background: rgba(46,204,113,0.15); color: #2ecc71; }
    .tool-btn img { width: 24px; height: 24px; object-fit: contain; }
    .tool-btn.eraser { color: #e74c3c; }
    .tool-btn.eraser.active { border-color: #e74c3c; background: rgba(231,76,60,0.15); color: #e74c3c; }

    /* ── 헥사 그리드 ── */
    .grid-area {
      position: relative;
    }
    .grid-container {
      position: relative;
    }
    .hex-cell {
      position: absolute;
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      background: #333350;
      cursor: pointer;
      transition: filter 0.1s;
    }
    .hex-cell::after {
      content: '';
      position: absolute;
      inset: 2px;
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      background: #252540;
    }
    .hex-cell:hover { filter: brightness(1.3); }
    .hex-cell.has-gimmick { filter: brightness(1.1); }

    .gimmick-img {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      object-fit: contain;
    }

    .coord-label {
      position: absolute;
      z-index: 2;
      color: rgba(255,255,255,0.25);
      font-size: 9px;
      pointer-events: none;
      text-align: center;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── 하단 버튼 ── */
    .bottom-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      background: #16162a;
      border-top: 2px solid #3a3a6e;
    }
    .action-btn {
      padding: 10px 24px;
      border: 2px solid #444;
      border-radius: 8px;
      background: #2a2a3e;
      color: #e0e0e0;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s;
    }
    .action-btn:hover { border-color: #7c6fff; color: #fff; }
    .action-btn.danger { border-color: #e74c3c; color: #e74c3c; }
    .action-btn.danger:hover { background: #e74c3c; color: #fff; }
    .action-btn.primary { border-color: #2ecc71; color: #2ecc71; }
    .action-btn.primary:hover { background: #2ecc71; color: #fff; }

    /* ── 스테이지 요약 ── */
    .stage-summary {
      text-align: center;
      padding: 8px;
      color: #888;
      font-size: 13px;
    }
    .stage-summary strong { color: #f1c40f; }
  </style>
</head>
<body>

  <!-- 스테이지 탭 -->
  <div class="stage-tabs" id="stage-tabs"></div>

  <!-- 메인 -->
  <div class="editor-body">
    <!-- 도구 패널 -->
    <div class="tool-panel">
      <div class="tool-panel-title">기믹 배치</div>
      <button class="tool-btn" data-tool="stone" data-level="1">
        <img src="assets/gimmick/stone_1.png"> 돌 1
      </button>
      <button class="tool-btn" data-tool="stone" data-level="2">
        <img src="assets/gimmick/stone_2.png"> 돌 2
      </button>
      <button class="tool-btn" data-tool="stone" data-level="3">
        <img src="assets/gimmick/stone_3.png"> 돌 3
      </button>
      <button class="tool-btn" data-tool="stone" data-level="4">
        <img src="assets/gimmick/stone_4.png"> 돌 4
      </button>
      <button class="tool-btn" data-tool="stone" data-level="5">
        <img src="assets/gimmick/stone_5.png"> 돌 5
      </button>
      <button class="tool-btn eraser" data-tool="eraser">✕ 지우기</button>
    </div>

    <!-- 그리드 -->
    <div class="grid-area">
      <div class="stage-summary" id="stage-summary"></div>
      <div class="grid-container" id="grid-container"></div>
    </div>
  </div>

  <!-- 하단 버튼 -->
  <div class="bottom-bar">
    <button class="action-btn danger" id="btn-reset-stage">이 스테이지 초기화</button>
    <button class="action-btn danger" id="btn-reset-all">전체 초기화</button>
    <button class="action-btn primary" id="btn-export">JSON 내보내기</button>
  </div>

<script>
// ── 상수 (game.js 동일) ──
const COLS_PATTERN = [9, 8, 9, 8, 9, 8, 9, 8, 9];
const HEX_SIZE = 36;
const HEX_W = HEX_SIZE * 2;
const HEX_H = Math.sqrt(3) * HEX_SIZE;
const COL_SPACING = HEX_SIZE * 1.5;
const ROW_SPACING = HEX_H;
const TOTAL_STAGES = 10;
const LS_KEY = 'hexMapEditorData';

// ── 상태 ──
let currentStage = 1;
let currentTool = null; // null | {tool:'stone',level:N} | {tool:'eraser'}
let stageData = loadData();

// ── localStorage ──
function loadData() {
  const raw = localStorage.getItem(LS_KEY);
  if (raw) {
    try { return JSON.parse(raw); } catch(e) {}
  }
  const data = {};
  for (let i = 1; i <= TOTAL_STAGES; i++) data[i] = {};
  return data;
}

function saveData() {
  localStorage.setItem(LS_KEY, JSON.stringify(stageData));
}

function getStageGimmicks(stage) {
  return stageData[stage] || {};
}

function setGimmick(stage, col, row, type, level) {
  if (!stageData[stage]) stageData[stage] = {};
  stageData[stage][`${col},${row}`] = { col, row, type, level };
  saveData();
}

function removeGimmick(stage, col, row) {
  if (!stageData[stage]) return;
  delete stageData[stage][`${col},${row}`];
  saveData();
}

// ── 좌표 계산 ──
function isLongCol(c) { return COLS_PATTERN[c] === 9; }
function getCellPos(col, row) {
  return {
    x: col * COL_SPACING,
    y: row * ROW_SPACING + (isLongCol(col) ? 0 : ROW_SPACING * 0.5)
  };
}

// ── 스테이지 탭 ──
function buildTabs() {
  const container = document.getElementById('stage-tabs');
  for (let i = 1; i <= TOTAL_STAGES; i++) {
    const btn = document.createElement('button');
    btn.className = 'stage-tab' + (i === currentStage ? ' active' : '');
    btn.textContent = i;
    btn.addEventListener('click', () => {
      currentStage = i;
      document.querySelectorAll('.stage-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGrid();
    });
    container.appendChild(btn);
  }
}

// ── 그리드 ──
function renderGrid() {
  const container = document.getElementById('grid-container');
  container.innerHTML = '';

  const totalW = (COLS_PATTERN.length - 1) * COL_SPACING + HEX_W;
  const totalH = 9 * ROW_SPACING + HEX_H * 0.5;
  container.style.width = `${totalW}px`;
  container.style.height = `${totalH}px`;

  const gimmicks = getStageGimmicks(currentStage);

  for (let col = 0; col < COLS_PATTERN.length; col++) {
    for (let row = 0; row < COLS_PATTERN[col]; row++) {
      const pos = getCellPos(col, row);
      const key = `${col},${row}`;

      // 셀 배경
      const cell = document.createElement('div');
      cell.className = 'hex-cell';
      cell.style.left = `${pos.x}px`;
      cell.style.top = `${pos.y}px`;
      cell.style.width = `${HEX_W}px`;
      cell.style.height = `${HEX_H}px`;

      // 좌표 라벨
      const label = document.createElement('div');
      label.className = 'coord-label';
      label.style.left = `${pos.x}px`;
      label.style.top = `${pos.y}px`;
      label.style.width = `${HEX_W}px`;
      label.style.height = `${HEX_H}px`;
      label.textContent = `${col},${row}`;

      // 기믹 이미지
      if (gimmicks[key]) {
        cell.classList.add('has-gimmick');
        const img = document.createElement('img');
        img.className = 'gimmick-img';
        img.src = `assets/gimmick/stone_${gimmicks[key].level}.png`;
        img.style.left = `${pos.x}px`;
        img.style.top = `${pos.y}px`;
        img.style.width = `${HEX_W}px`;
        img.style.height = `${HEX_H}px`;
        container.appendChild(img);
      }

      // 클릭 이벤트
      cell.addEventListener('click', () => onCellClick(col, row));

      container.appendChild(cell);
      container.appendChild(label);
    }
  }

  updateSummary();
}

function onCellClick(col, row) {
  if (!currentTool) return;

  if (currentTool.tool === 'eraser') {
    removeGimmick(currentStage, col, row);
  } else if (currentTool.tool === 'stone') {
    setGimmick(currentStage, col, row, 'stone', currentTool.level);
  }

  renderGrid();
}

function updateSummary() {
  const gimmicks = getStageGimmicks(currentStage);
  const count = Object.keys(gimmicks).length;
  document.getElementById('stage-summary').innerHTML =
    `Stage <strong>${currentStage}</strong> — 기믹 <strong>${count}</strong>개 배치됨`;
}

// ── 도구 버튼 ──
function setupTools() {
  document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tool = btn.dataset.tool;
      const level = btn.dataset.level ? parseInt(btn.dataset.level) : null;
      const key = level ? `${tool}_${level}` : tool;
      const currentKey = currentTool
        ? (currentTool.level ? `${currentTool.tool}_${currentTool.level}` : currentTool.tool)
        : null;

      if (currentKey === key) {
        // 토글 해제
        currentTool = null;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      } else {
        currentTool = level ? { tool, level } : { tool };
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
    });
  });
}

// ── 하단 버튼 ──
function setupActions() {
  document.getElementById('btn-reset-stage').addEventListener('click', () => {
    if (!confirm(`Stage ${currentStage} 기믹을 전부 지울까요?`)) return;
    stageData[currentStage] = {};
    saveData();
    renderGrid();
  });

  document.getElementById('btn-reset-all').addEventListener('click', () => {
    if (!confirm('전체 스테이지 기믹을 지울까요?')) return;
    for (let i = 1; i <= TOTAL_STAGES; i++) stageData[i] = {};
    saveData();
    renderGrid();
  });

  document.getElementById('btn-export').addEventListener('click', () => {
    const stages = [];
    for (let i = 1; i <= TOTAL_STAGES; i++) {
      const gimmicks = Object.values(stageData[i] || {}).map(g => ({
        col: g.col, row: g.row, type: g.type, level: g.level
      }));
      stages.push({ stage: i, gimmicks });
    }
    const json = JSON.stringify({ stages }, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'stage_maps.json';
    a.click();
    URL.revokeObjectURL(url);
  });
}

// ── 초기화 ──
buildTabs();
setupTools();
setupActions();
renderGrid();
</script>
</body>
</html>
